name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked --python ${{ matrix.python-version }} --extra jax --extra dev
      - run: uv pip install --python .venv "flax>=0.10" "optax>=0.2"  # for the CleanRL JAX example test
      - run: uv run --no-sync pytest -m "not slow"

  unity:
    name: Unity tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked --python 3.12 --extra jax --extra dev
      - run: uv pip install --python .venv "flax>=0.10" "optax>=0.2"  # for the CleanRL JAX example test
      - run: uv run --no-sync pytest -m slow
